name: Test APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK with testkey
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Build signed release APK
        run: |
          set -euo pipefail

          test -s app/testkey.jks

          ./gradlew --no-daemon clean assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk \
            "output/OwnDroid-testkey-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: OwnDroid-testkey-${{ github.run_number }}
          path: output/OwnDroid-testkey-${{ github.run_number }}.apk
          retention-days: 10
          compression-level: 0
          if-no-files-found: error
